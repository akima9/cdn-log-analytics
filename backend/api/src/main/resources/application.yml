spring:
  profiles:
    active: local
  application:
    name: cdn-log-analytics-api

  datasource:
    url: jdbc:mysql://localhost:3306/cdn_log_analytics?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:cdn}
    password: ${DB_PASSWORD:cdn1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # Flyway가 스키마 관리, JPA는 검증만
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:cdn-log-analytics-jwt-secret-key-must-be-at-least-256-bits-long}
  access-token-expiry: 1800      # 30분 (초)
  refresh-token-expiry: 1209600  # 14일 (초)

server:
  port: 8080
  servlet:
    context-path: /
