services:
  mysql:
    image: mysql:8.4
    container_name: cdn-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: cdn_log_analytics
      MYSQL_USER: cdn
      MYSQL_PASSWORD: cdn1234
    ports:
      - "3306:3306"
    volumes:
      - cdn-mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "cdn", "-pcdn1234" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: cdn-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - cdn-redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cdn-mysql-data:
  cdn-redis-data:
